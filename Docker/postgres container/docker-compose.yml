services:
  postgres:
    image: postgres:17
    container_name: smart_library_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: smart_library_user
      POSTGRES_PASSWORD: smart_library_password
      POSTGRES_DB: smart_library_learning_db

    ports:
      - "5433:5432"

    volumes:
      - smart_library_postgres_data:/var/lib/postgresql/data

volumes:
  smart_library_postgres_data: