services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smart_library_app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smart_library_learning_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


  postgres:
    image: postgres:17

    container_name: smart_library_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_library_learning_db

    ports:
      - "5433:5432"

    volumes:
      - smart_library_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d smart_library_learning_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    container_name: smart_library_redis

    ports:
      - "6379:6379"

    volumes:
      - smart_library_redis_data:/data

    restart: unless-stopped


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smart_library_celery_worker

    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smart_library_learning_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smart_library_celery_beat

    command: celery -A app.core.celery_app.celery_app beat --loglevel=info

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smart_library_learning_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


volumes:
  smart_library_postgres_data:
  smart_library_redis_data: